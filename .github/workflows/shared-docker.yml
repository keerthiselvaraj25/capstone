name: Docker, Build & Publish

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: false
        default: "globalcart"
    secrets:
      CR_PAT:
        required: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build the Docker Image
        run: docker build -t ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:${{ github.run_number }}-$SHORT_SHA .
      - name: Push the Docker Image
        run: docker push ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:${{ github.run_number }}-$SHORT_SHA
