name: CI and CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm test

  docker:
    needs: build-test
    uses: ./.github/workflows/shared-docker.yml
    secrets: inherit

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://global-cart.example.com
    steps:
      - name: Deploy to Production
        run: echo "Deploying GlobalCart API to Production environment"
